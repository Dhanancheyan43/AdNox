[package]
name = "adnox-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI + JNI bridge exposing the AdNox engine to Android and desktop UIs"

[lib]
name = "adnox"
# cdylib -> libadnox.so / adnox.dll / libadnox.dylib for the platform apps to load.
# staticlib -> libadnox.a for linking into other native code.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
adnox-core = { path = "../core" }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
